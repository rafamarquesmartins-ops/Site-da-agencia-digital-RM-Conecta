<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Palavra-Passe | RM Conecta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-container {
            max-width: 450px;
            margin: 10vh auto;
            padding: 40px;
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
    </style>
</head>
<body class="u-c8101e">
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">RM <span>Conecta</span></a>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="u-95500a">
                <i data-lucide="key" class="u-bb998c"></i>
            </div>
            <h1 class="u-e23ca9">Nova Palavra-Passe</h1>
            <p class="u-b8138a" id="status-text">Introduza a sua nova palavra-passe abaixo.</p>

            <form id="form-new-password">
                <div class="u-4b39a0">
                    <label for="new-password" class="u-ea5019">Nova Palavra-passe</label>
                    <input type="password" id="new-password" class="u-2ae825" required>
                    <button type="button" onclick="togglePasswordVisibility('new-password')" class="u-ea8dbc">
                        <i data-lucide="eye" class="u-052ff0"></i>
                    </button>
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary u-199b6f">Confirmar e Entrar</button>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        lucide.createIcons();
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const actionCode = urlParams.get('oobCode');

            if (mode !== 'resetPassword' || !actionCode) {
                document.getElementById('status-text').innerHTML = '<span class="u-f479d1">Link de recuperação inválido ou expirado.</span>';
                document.getElementById('form-new-password').style.display = 'none';
                return;
            }

            const form = document.getElementById('form-new-password');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const btn = document.getElementById('btn-submit');
                btn.disabled = true;
                btn.innerHTML = 'A atualizar...';

                auth.confirmPasswordReset(actionCode, newPassword)
                    .then(() => {
                        document.getElementById('status-text').innerHTML = '<span class="u-e24d29">Palavra-passe atualizada com sucesso! A entrar...</span>';
                        form.style.display = 'none';
                        // Auto login? The user needs to supply email. Unfortunately, auth.confirmPasswordReset does not log them in directly.
                        // Or we can just redirect them to area-cliente.html so they can login.
                        setTimeout(() => {
                            window.location.href = 'area-cliente.html';
                        }, 2000);
                    })
                    .catch((error) => {
                        console.error(error);
                        document.getElementById('status-text').innerHTML = '<span class="u-f479d1">Ocorreu um erro ao atualizar a palavra-passe. O link pode ter expirado.</span>';
                        btn.disabled = false;
                        btn.innerHTML = 'Confirmar e Entrar';
                    });
            });
        });
    </script>
</body>
</html>
